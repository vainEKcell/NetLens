<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>NetWatch</title>
</head>
<body>
  <div id="app">
    <!-- 常驻状态栏：横贯全宽（恢复早期版本布局） -->
    <header id="topbar">
      <div class="metric">
        <span class="label" id="lbl-up">总上传</span>
        <span class="value up" id="tb-up">0 B/s</span>
      </div>
      <div class="metric">
        <span class="label" id="lbl-down">总下载</span>
        <span class="value down" id="tb-down">0 B/s</span>
      </div>
      <div class="metric">
        <span class="label" id="lbl-session">会话累计</span>
        <span class="value small" id="tb-session">—</span>
      </div>
      <!-- 曲线紧贴数据，中间不留大空隙 -->
      <div id="spark"><canvas id="spark-canvas" width="220" height="44"></canvas></div>
      <div class="spacer"></div>
      <button id="btn-pause">暂停监控</button>
    </header>
    <div id="body">
      <aside id="sidebar">
        <div id="brand"><span class="dot"></span>NetWatch</div>
        <nav id="nav"></nav>
        <div class="ver">0.1.5 · alpha</div>
      </aside>
      <main id="content"></main>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
