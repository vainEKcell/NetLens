<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>NetLens</title>
</head>
<body>
  <div id="app">
    <!-- 常驻状态栏：最左=应用 logo 收放按钮 + 品牌名，其后监控控件，右侧数据与曲线 -->
    <header id="topbar">
      <button id="nav-toggle" title="收起 / 展开导航">
        <img src="/brand.png" width="28" height="28" alt="NetLens" class="brand-img brand-dark" />
        <img src="/brand-light.png" width="28" height="28" alt="NetLens" class="brand-img brand-light" />
      </button>
      <span id="brand-name">NetLens</span>
      <div class="tb-sep"></div>
      <button id="btn-pause" title="暂停监控"><span id="pause-label">暂停监控</span></button>
      <div class="tb-left">
        <div class="search-group">
          <input type="text" id="tb-search" placeholder="搜索 进程 / 路径 / PID" />
          <button id="tb-search-btn" title="搜索">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
          </button>
        </div>
        <div class="tb-row2">
          <label class="tb-check"><input type="checkbox" id="tb-loopback" /><span id="tb-loopback-label">隐藏回环</span></label>
          <label class="tb-check"><input type="checkbox" id="tb-flagged" /><span id="tb-flagged-label">仅看可疑</span></label>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="metric m-up">
        <span class="label" id="lbl-up">总上传</span>
        <span class="value up" id="tb-up">0 B/s</span>
      </div>
      <div class="metric m-down">
        <span class="label" id="lbl-down">总下载</span>
        <span class="value down" id="tb-down">0 B/s</span>
      </div>
      <div class="metric m-session">
        <span class="label" id="lbl-session">会话累计</span>
        <span class="value small" id="tb-session">—</span>
      </div>
      <!-- 曲线固定宽度：不受左侧数字长短影响 -->
      <div id="spark"><canvas id="spark-canvas" width="260" height="44"></canvas></div>
    </header>
    <div id="body">
      <aside id="sidebar">
        <nav id="nav"></nav>
        <div class="ver">0.1.5 · alpha</div>
      </aside>
      <main id="content"></main>
    </div>
    <!-- 详情覆盖层：点击进程行后自右滑入；shade 为打开时的视觉遮挡（点行可切换、点空白收起） -->
    <div id="detail-shade"></div>
    <div id="detail-overlay"><div id="detail-body"></div></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
