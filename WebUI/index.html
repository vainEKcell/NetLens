<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>NetLens</title>
</head>
<body>
  <div id="app">
    <!-- 常驻状态栏：品牌在侧栏顶部（一体），状态栏=监控控件+数据+曲线（曲线占满剩余宽度） -->
    <header id="topbar">
      <label class="tb-check"><input type="checkbox" id="tb-loopback" /><span id="tb-loopback-label">隐藏回环</span></label>
      <label class="tb-check"><input type="checkbox" id="tb-flagged" /><span id="tb-flagged-label">仅看可疑</span></label>
      <input type="text" id="tb-search" placeholder="搜索 进程 / 路径 / PID" />
      <div class="spacer"></div>
      <div class="metric">
        <span class="label" id="lbl-up">总上传</span>
        <span class="value up" id="tb-up">0 B/s</span>
      </div>
      <div class="metric">
        <span class="label" id="lbl-down">总下载</span>
        <span class="value down" id="tb-down">0 B/s</span>
      </div>
      <div class="metric">
        <span class="label" id="lbl-session">会话累计</span>
        <span class="value small" id="tb-session">—</span>
      </div>
      <!-- 曲线固定宽度：不受左侧数字长短影响 -->
      <div id="spark"><canvas id="spark-canvas" width="260" height="44"></canvas></div>
      <button id="btn-pause" title="暂停监控">
        <svg id="ic-pause" viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg>
        <svg id="ic-play" viewBox="0 0 16 16" width="15" height="15" fill="currentColor" style="display:none"><path d="M4 2l10 6-10 6z"/></svg>
      </button>
    </header>
    <div id="body">
      <aside id="sidebar">
        <div id="brand">
          <img src="/brand.png" alt="NetLens" width="26" height="26" />
          <span id="brand-name">NetLens</span>
        </div>
        <button id="nav-toggle" title="收起 / 展开导航">«</button>
        <nav id="nav"></nav>
        <div class="ver">0.1.5 · alpha</div>
      </aside>
      <main id="content"></main>
    </div>
    <!-- 详情覆盖层：点击进程行后自右滑入 -->
    <div id="detail-overlay"><div id="detail-body"></div></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
